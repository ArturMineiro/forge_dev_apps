<html lang="pt-BR">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>ForgeDevApps — Sites, Apps e Sistemas sob medida</title>
    <meta name="description" content="Desenvolvimento de softwares, sites e aplicativos sob medida para o seu negócio." />

    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />

    <meta property="og:type" content="website" />

    <script>
      // Aplica o tema salvo antes de renderizar (evita "piscar" claro no modo escuro)
      (function () {
        try {
          var t = localStorage.getItem("vite-ui-theme") || "system";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.add(dark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
